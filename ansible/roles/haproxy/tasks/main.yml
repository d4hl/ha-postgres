---
# 5432/5434/7000 are the frontend bind ports. 5433 is the *backend* port on
# the PostgreSQL hosts: haproxy_t needs name_connect to it, and the policy only
# allows connecting to http_port_t. `local: true` keeps this per-host, so on
# PostgreSQL nodes 5433 stays postgresql_port_t (for name_bind).
- name: Allow HAProxy to bind/connect its TCP ports (SELinux)
  become: true
  community.general.seport:
    ports: "{{ item }}"
    proto: tcp
    setype: http_port_t
    state: present
    local: true
  loop:
    - "5432"
    - "5433" # for outbout postgres
    - "5434"
    - "7000"

- name: Install HAProxy
  ansible.builtin.dnf:
    name: haproxy
    state: present

- name: Create HAProxy state directory
  ansible.builtin.file:
    path: /var/lib/haproxy
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Build the stats TLS bundle
  ansible.builtin.include_tasks: stats-cert.yml

- name: Deploy HAProxy configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0644"
  notify: Restart HAProxy
  no_log: true

- name: Open firewall ports for HAProxy
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    permanent: true
    state: enabled
    immediate: true
  loop:
    - "{{ haproxy_primary_port }}"
    - "{{ haproxy_replica_port }}"
    - "{{ haproxy_stats_port }}"
  when: ansible_facts["os_family"] == "RedHat"
  ignore_errors: true

- name: Enable and start HAProxy
  ansible.builtin.systemd:
    name: haproxy
    enabled: true
    state: started

- name: Restart HAProxy when the stats bundle was rebuilt
  ansible.builtin.systemd:
    name: haproxy
    state: restarted
  when: haproxy_stats_bundle.changed | default(false)
