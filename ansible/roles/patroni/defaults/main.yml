---
# generic params

# Derived paths (from group_vars/postgres.yml)
patroni_config: "{{ patroni_config_dir }}/patroni.yml"
patroni_ca_cert: "{{ patroni_ssl_dir }}/{{ patroni_ca_file }}"
patroni_etcd_client_cert: "{{ patroni_ssl_dir }}/{{ patroni_etcd_client_cert_file }}"
patroni_etcd_client_key: "{{ patroni_ssl_dir }}/{{ patroni_etcd_client_key_file }}"
patroni_pg_cert: "{{ patroni_ssl_dir }}/{{ patroni_pg_cert_file }}"
patroni_pg_key: "{{ patroni_ssl_dir }}/{{ patroni_pg_key_file }}"

# PostgreSQL paths
#   Native AppStream layout on CentOS Stream 10. 
#   The bin dir is refined at runtime from `pg_config --bindir` (see tasks/main.yml); 
#   override in group_vars if a different layout is ever used.
patroni_data_dir: /var/lib/pgsql/data
patroni_bin_dir: /usr/bin

# Python dependencies
patroni_pip_packages:
  - "patroni[etcd3]"
  - psycopg2-binary

# Permissions
patroni_dir_mode: "0750"
patroni_config_mode: "0640"
patroni_cert_mode: "0644"
patroni_key_mode: "0600"

# Dynamic configuration (DCS)
# Rendered into patroni.yml AND pushed into etcd (tasks/dcs.yml)
patroni_pg_parameters:
  ssl: "on"
  ssl_cert_file: "{{ patroni_ssl_dir }}/{{ patroni_pg_cert_file }}"
  ssl_key_file: "{{ patroni_ssl_dir }}/{{ patroni_pg_key_file }}"
  ssl_ca_file: "{{ patroni_ssl_dir }}/{{ patroni_ca_file }}"
  wal_level: replica
  hot_standby: "on"
  wal_log_hints: "on"
  max_wal_senders: 10
  max_replication_slots: 10
  wal_keep_size: 1024
  max_wal_size: 4096

patroni_pg_hba: >-
  {{ ['local all all trust',
      'host all all 127.0.0.1/32 trust',
      'host all all ::1/128 trust',
      'local replication all trust',
      'host replication all 127.0.0.1/32 trust',
      'host replication all ::1/128 trust']
     + (groups['postgres'] | map('extract', hostvars, 'ansible_host')
        | map('regex_replace', '^(.*)$', 'hostssl replication ' ~ patroni_replication_user ~ ' \1/32 cert map=replication')
        | list)
     + ['hostssl all all 0.0.0.0/0 scram-sha-256'] }}

patroni_pg_ident: >-
  {{ groups['postgres']
     | map('regex_replace', '^(.*)$', 'replication \1 ' ~ patroni_replication_user) | list }}

patroni_dcs:
  ttl: 30
  loop_wait: 10
  retry_timeout: 10
  maximum_lag_on_failover: 1048576
  postgresql:
    use_pg_rewind: true
    use_slots: true
    parameters: "{{ patroni_pg_parameters }}"
    pg_hba: "{{ patroni_pg_hba }}"
    pg_ident: "{{ patroni_pg_ident }}"
