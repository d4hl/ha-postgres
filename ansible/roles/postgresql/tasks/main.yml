---
# Native AppStream packaging on CentOS Stream 10:
#   binaries -> /usr/bin, data dir -> /var/lib/pgsql/data
# Patroni (not systemd) owns the cluster; `postgresql.service` stays stopped.

- name: Install PostgreSQL packages
  ansible.builtin.dnf:
    name: "{{ postgresql_packages }}"
    state: present

- name: Create postgres system user
  ansible.builtin.user:
    name: postgres
    system: true
    shell: /sbin/nologin
    home: /var/lib/pgsql
    create_home: false
    state: present

- name: Create PostgreSQL data directory
  ansible.builtin.file:
    path: /var/lib/pgsql/data
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Stop any running PostgreSQL instance (Patroni will manage it)
  ansible.builtin.systemd:
    name: postgresql
    enabled: false
    state: stopped
  failed_when: false

- name: Allow PostgreSQL port in firewalld
  ansible.posix.firewalld:
    port: "{{ postgresql_port }}/tcp"
    permanent: true
    state: enabled
    immediate: true
  when: ansible_facts["os_family"] == "RedHat"

- name: Label the PostgreSQL port for SELinux
  community.general.seport:
    ports: "{{ postgresql_port }}"
    proto: tcp
    setype: postgresql_port_t
    state: present
    local: true
