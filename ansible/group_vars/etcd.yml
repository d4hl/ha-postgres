---
# ===========================================================================
# etcd layer
# ===========================================================================

etcd_cluster_name: "{{ cluster_name }}-etcd"

# Member name used in `initial-cluster` and in the etcd config `name`.
# NOTE: changing this on an existing cluster requires a rebootstrap:
#   ansible-playbook site.yml --tags etcd -e etcd_rebootstrap=true
etcd_node_name: "{{ inventory_hostname }}"

etcd_peer_port: 2380

# --- Paths -----------------------------------------------------------------
etcd_conf_dir: /etc/etcd
etcd_ssl_dir: /etc/etcd/ssl
etcd_data_dir: /var/lib/etcd

# --- Certificates ----------------------------------------------------------
# The peer certificate is presented to other etcd members (port 2380) and also
# used as the server certificate for client connections (port 2379).
etcd_peer_cert_file: peer.crt
etcd_peer_key_file: peer.key
etcd_ca_file: ca.crt

# CN of the peer certificate. Kept deliberately different from the Patroni
# client CN (which is the inventory hostname) so that peer traffic can be
# pinned with etcd_peer_allowed_cn below.
etcd_peer_cn: "etcd-{{ inventory_hostname | regex_replace('^pg-', '') }}"

# `peer-transport-security.allowed-cn` — restrict which certificate CNs may
# act as etcd peers. Empty list = accept any certificate signed by the CA.
#
# To enable (this is the peer/client separation):
#   1. make sure the peer cert uses etcd_peer_cn (set above),
#   2. re-issue certs:  -e vault_pki_force_renew=true
#   3. restart all etcd members together (rolling restart would be rejected
#      while old CNs are still in use).
# etcd_peer_allowed_cn: ["etcd-01", "etcd-02", "etcd-03"]
etcd_peer_allowed_cn: []

# --- Vault PKI: certificates this layer consumes ---------------------------
vault_pki_certs_etcd:
  - name: etcd-peer
    common_name: "{{ etcd_peer_cn }}"
    alt_names: "{{ [etcd_peer_cn, inventory_hostname] | unique | join(',') }}"
    ip_sans: "{{ ansible_host }}"
    dir: "{{ etcd_ssl_dir }}"
    cert: "{{ etcd_peer_cert_file }}"
    key: "{{ etcd_peer_key_file }}"